<div class="single-post">
    <div class="feature-img">
        <img class="img-fluid" src="{{ post.image.url }}" alt="{{ post.title }}" />
    </div>
    <div class="blog_details">
        <h2>{{ post.title }}</h2>
        <ul class="blog-info-link mt-3 mb-4">
            <li>
                <a href="#"><i class="fa fa-user"></i> {{ post.tag.all|join:', ' }}</a>
            </li>
            <li>
                <a href="#"><i class="fa fa-eye"></i> {{ post.view_count }}</a>
            </li>
            <li>
                <a href="#"><i class="fa fa-comments"></i> {{ post.comment_set.count }} Comments</a>
            </li>
        </ul>
        {{ post.content|linebreaks }}
    </div>
</div>
