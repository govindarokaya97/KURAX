{% load static %}
<div class="col-lg-8">

    <!-- Trending Top -->
    <div class="trending-top mb-30">
        {% for top in trending_top %}
        <div class="trend-top-img">
            <img src="{{ top.image.url }}" alt="" />
            <div class="trend-top-cap">
                <span>{{ top.category }}</span>
                <h2><a href="{% url 'detail' top.id %}">{{ top.title|truncatechars:50 }}</a></h2>
            </div>
        </div>
        {% endfor %}
    </div>
    <!-- Trending Bottom -->
    <div class="trending-bottom">
        <div class="row">
            {% for featured_post in trending_bottom %}
            <div class="col-lg-4">
                <div class="single-bottom mb-35">
                    <div class="trend-bottom-img mb-30">
                        <img src="{{ featured_post.image.url }}" alt="{{ featured_post.title }}" width="170"
                            height="150" />
                    </div>
                    <div class="trend-bottom-cap">
                        <span class="color1">{{ featured_post.category.name }}</span>
                        <h4><a href="{% url 'detail' featured_post.id %}">{{ featured_post.title|truncatechars:30 }}</a>
                        </h4>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
