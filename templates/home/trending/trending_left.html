{% load static %}
<div class="col-lg-8">
    <!-- Trending Top -->
    <div class="trending-top mb-30">
        <div class="trend-top-img">
            <img src="{{ trending_top.image.url }}" alt="">
            <div class="trend-top-cap">
                <span>{{ trending_top.category }}</span>
                <h2><a href="details.html">{{ trending_top.title|truncatechars:60 }}</a></h2>
            </div>
        </div>
    </div>
    <!-- Trending Bottom -->
    <div class="trending-bottom">
        <div class="row">
            {% for featured_post in trending_bottom %}
            <div class="col-lg-4">
                <div class="single-bottom mb-35">
                    <div class="trend-bottom-img mb-30">
                        <img src="{{ featured_post.image.url }}" alt="{{ featured_post.title }}" width="150" ,
                            height="120">
                    </div>
                    <div class="trend-bottom-cap">
                        <span class="color1">{{ featured_post.category.name }}</span>
                        <h4><a href="details.html">{{ featured_post.title|truncatechars:40 }}</a></h4>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
