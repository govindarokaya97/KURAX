<!-- Riht content -->
<div class="col-lg-4">
    {% for post in recent_posts %}
    <div class="trand-right-single d-flex">
        <div class="trand-right-img">
            <img src="{{ post.image.url }}" alt="" width="110" height="70">
        </div>
        <div class="trand-right-cap">
            <span class="color1">{{ post.category.name }}</span>
            <h4><a href="{% url 'detail' post.id  %}">{{ post.title|truncatechars:40 }}</a></h4>
        </div>
    </div>
    {% endfor %}
</div>
