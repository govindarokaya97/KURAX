{% extends 'panel/base.html' %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">

        <!-- Featured Image -->
        {% if post.image %}
        <div class="h-72 md:h-96 overflow-hidden">
            <img src="{{ post.image.url }}" alt="{{ post.title }}"
                class="w-full h-full object-cover transition duration-500 hover:scale-105">
        </div>
        {% endif %}

        <!-- Post Header -->
        <div class="p-8 border-b">

            <h1 class="text-4xl font-bold text-gray-900 mb-4">
                {{ post.title }}
            </h1>

            <div class="flex flex-wrap items-center gap-6 text-gray-500 text-sm">

                <div class="flex items-center gap-2">
                    <span class="font-semibold text-gray-700">
                        👤 Author:
                    </span>
                    <span>{{ post.author }}</span>
                </div>

                <div class="flex items-center gap-2">
                    <span class="font-semibold text-gray-700">
                        📅 Published:
                    </span>
                    <span>{{ post.published_at|date:"F d, Y" }}</span>
                </div>

            </div>

        </div>

        <!-- Content -->
        <div class="p-8">

            <div class="prose prose-lg max-w-none text-gray-700 leading-8 whitespace-pre-line">
                {{ post.content }}
            </div>

        </div>

        <!-- Footer -->
        <div class="bg-gray-50 border-t p-6 flex flex-col sm:flex-row justify-between items-center gap-4">

            <a href="{% url 'news-admin:post_list' %}"><button
                    class="px-5 py-2.5 bg-gray-200 hover:bg-gray-300 rounded-lg font-medium transition">
                    ← Back to Posts
                </button>
            </a>

            <div class="flex gap-3">
                {% if user.is_authenticated %}

                <a href="{% url 'news-admin:post_update' post.id %}"><button
                        class="px-5 py-2.5 bg-yellow-500 hover:bg-yellow-600 text-white rounded-lg shadow transition">
                        ✏ Edit
                    </button></a>

                <a href="{% url 'news-admin:post_delete' post.id %}"><button
                        class="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg shadow transition"
                        onclick="return confirm('Are you sure you want to delete this post ? ')">
                        🗑 Delete
                    </button>
                </a>
                {% endif %}
            </div>

        </div>

    </div>

</div>
{% endblock %}
